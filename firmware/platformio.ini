; WiFi credentials are not stored in this repo: on first boot the board opens
; a "door-cam-setup" hotspot for setup.
[platformio]
default_envs = xiao_sense

; AI-Thinker ESP32-CAM. Video only, it has no mic.
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    tzapu/WiFiManager@^2.0.17

; XIAO ESP32S3 Sense: the door unit's board.
[env:xiao_sense]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200  ; faster rates hit serial errors on this board
board_build.partitions = partitions_xiao.csv
; The Arduino default (0xe000) would land inside this layout's nvs partition.
board_upload.arduino.boot_app0 = 0xf000
build_flags =
    -DBOARD_XIAO_S3_SENSE
lib_deps =
    tzapu/WiFiManager@^2.0.17

; Adds a mic audio stream for doorbell training. Don't run this build at the
; door: anyone on the network could listen to the room.
[env:xiao_sense_training]
extends = env:xiao_sense
build_flags =
    ${env:xiao_sense.build_flags}
    -DAUDIO_STREAM
